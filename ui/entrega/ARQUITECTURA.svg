<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="990" viewBox="0 0 1280 990"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#1a619c"/></marker></defs><rect width="1280" height="990" fill="#f7f9fc"/><g font-family="Arial,DejaVu Sans,sans-serif" fill="#163354"><text x="55" y="55" font-size="30" font-weight="700">Proyecto documental · Arquitectura del prototipo entregado</text><text x="55" y="88" font-size="17" fill="#596f88">Workflow determinista con adaptadores; extracción, interpretación y validación separadas.</text><rect x="55" y="140" width="255" height="142" rx="14" fill="white" stroke="#cbd9e7" stroke-width="2"/><text x="73" y="175" font-size="20" font-weight="700">1 · Entrada</text><text x="73" y="216" font-size="15">PDF original + SHA-256</text><text x="73" y="246" font-size="14" fill="#596f88">Carga, tamaño y páginas</text><rect x="360" y="140" width="255" height="142" rx="14" fill="white" stroke="#cbd9e7" stroke-width="2"/><text x="378" y="175" font-size="20" font-weight="700">2 · Inspección</text><text x="378" y="216" font-size="15">Por página: texto / scan</text><text x="378" y="246" font-size="14" fill="#596f88">Protegido y corrupto</text><rect x="665" y="140" width="255" height="142" rx="14" fill="white" stroke="#cbd9e7" stroke-width="2"/><text x="683" y="175" font-size="20" font-weight="700">3 · Lectura</text><text x="683" y="216" font-size="15">PyMuPDF / Tesseract spa</text><text x="683" y="246" font-size="14" fill="#596f88">Texto, cajas y fuentes</text><rect x="970" y="140" width="255" height="142" rx="14" fill="white" stroke="#cbd9e7" stroke-width="2"/><text x="988" y="175" font-size="20" font-weight="700">4 · Contexto</text><text x="988" y="216" font-size="15">Encabezados y roles</text><text x="988" y="246" font-size="14" fill="#596f88">Remisiones y ranking léxico</text><rect x="970" y="430" width="255" height="142" rx="14" fill="white" stroke="#cbd9e7" stroke-width="2"/><text x="988" y="465" font-size="20" font-weight="700">5 · Extracción</text><text x="988" y="506" font-size="15">Reglas o Qwen local</text><text x="988" y="536" font-size="14" fill="#596f88">Adaptador explícito</text><rect x="665" y="430" width="255" height="142" rx="14" fill="white" stroke="#cbd9e7" stroke-width="2"/><text x="683" y="465" font-size="20" font-weight="700">6 · Controles</text><text x="683" y="506" font-size="15">Esquema + cita literal</text><text x="683" y="536" font-size="14" fill="#596f88">Rol, conflictos, límites</text><rect x="360" y="430" width="255" height="142" rx="14" fill="white" stroke="#cbd9e7" stroke-width="2"/><text x="378" y="465" font-size="20" font-weight="700">7 · Resultado</text><text x="378" y="506" font-size="15">8 datos + estado + evidencia</text><text x="378" y="536" font-size="14" fill="#596f88">JSON reutilizable</text><rect x="55" y="430" width="255" height="142" rx="14" fill="white" stroke="#cbd9e7" stroke-width="2"/><text x="73" y="465" font-size="20" font-weight="700">8 · Revisión</text><text x="73" y="506" font-size="15">Visor de todas las páginas</text><text x="73" y="536" font-size="14" fill="#596f88">Valor y cita; sin aprobar acta</text><line x1="310" y1="211" x2="355" y2="211" stroke="#1a619c" stroke-width="3" marker-end="url(#arrow)"/><line x1="615" y1="211" x2="660" y2="211" stroke="#1a619c" stroke-width="3" marker-end="url(#arrow)"/><line x1="920" y1="211" x2="965" y2="211" stroke="#1a619c" stroke-width="3" marker-end="url(#arrow)"/><line x1="1097" y1="282" x2="1097" y2="425" stroke="#1a619c" stroke-width="3" marker-end="url(#arrow)"/><line x1="970" y1="501" x2="925" y2="501" stroke="#1a619c" stroke-width="3" marker-end="url(#arrow)"/><line x1="665" y1="501" x2="620" y2="501" stroke="#1a619c" stroke-width="3" marker-end="url(#arrow)"/><line x1="360" y1="501" x2="315" y2="501" stroke="#1a619c" stroke-width="3" marker-end="url(#arrow)"/><text x="55" y="330" font-size="17" fill="#2c6c99">Sin ground truth en extracción · Original inmutable · Propuestas y respuestas originales conservadas</text><rect x="55" y="635" width="1170" height="113" rx="14" fill="#e9f2fb"/><text x="80" y="671" font-size="20" font-weight="700">Persistencia y modos de ejecución</text><text x="80" y="705" font-size="16">Servicio local / Colab: trabajos y revisiones en SQLite + archivos · CLI: JSON y evidencia.</text><text x="80" y="731" font-size="15">Frontend privado: revisión de resultados guardados · El hosting estático no ejecuta OCR ni Qwen.</text><rect x="55" y="795" width="1170" height="145" rx="14" fill="#fff7e8" stroke="#d2b66e" stroke-dasharray="6 5"/><text x="80" y="834" font-size="20" font-weight="700">Evolución a producción · pendiente</text><text x="80" y="870" font-size="16">Referencias independientes y riesgo medido · IAM y cifrado · API productiva, cola durable y workers.</text><text x="80" y="901" font-size="16">Retención y auditoría autenticada · Carga, fallos y recuperación · Costos y monitorización.</text><text x="80" y="927" font-size="14" fill="#7d6836">Publicar una interfaz, generar JSON o aprobar tests de código no acredita precisión documental.</text></g></svg>