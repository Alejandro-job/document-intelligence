name: Pruebas del proyecto
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lectura.lock.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Instalar lector verificado
        run: python -m pip install -r requirements-lectura.lock.txt
      - name: Comprobar contenido versionado
        run: python scripts/verificar_publicacion.py
      - name: Pruebas Python sin descargar modelos
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Pruebas del frontend
        run: node --test tests/*.test.mjs
